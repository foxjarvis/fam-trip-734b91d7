<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b2a3a">
<title>Family Trip</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b2a3a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 50% 0%,#1d6f8a 0%,#0b2a3a 60%)}
.card{width:min(380px,100%);text-align:center}
.sun{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#ff9f5a 70%);box-shadow:0 0 60px #ff9f5a88;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 20px;opacity:.75;font-size:15px}
input{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:1px solid #ffffff44;background:#ffffff14;color:#fff;text-align:center;outline:none}
input:focus{border-color:#ffd37a}
button{margin-top:12px;width:100%;font-size:17px;font-weight:600;padding:14px;border-radius:14px;border:0;background:#ffb44a;color:#2b1700}
#err{min-height:22px;margin-top:12px;color:#ffb3a8;font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>

  <button id="go" type="submit">Open</button>

</form>

  const err=document.getElementById("err"),go=document.getElementById("go"),card=document.getElementById("f");
